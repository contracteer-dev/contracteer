openapi: 3.0.0
info:
  title: Form URL-Encoded Request Body
  version: '1.0'
paths:
  /token:
    post:
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                access_token:
                  type: string
      responses:
        '204':
          description: Token accepted
