openapi: 3.0.0
info:
  title: Shared Infinite Circular Ref AllOf API
  version: '1.0'
servers:
  - url: 'http://localhost:3000'
paths:
  /a:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/First'
      responses:
        200:
          description: OK
  /b:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Third'
      responses:
        200:
          description: OK
components:
  schemas:
    First:
      allOf:
        - $ref: '#/components/schemas/Second'
    Second:
      allOf:
        - $ref: '#/components/schemas/First'
        - type: object
          properties:
            x:
              type: string
    Third:
      allOf:
        - $ref: '#/components/schemas/Second'
