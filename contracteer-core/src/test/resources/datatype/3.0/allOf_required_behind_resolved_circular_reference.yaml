openapi: "3.0.0"
info:
  title: Test API
  version: '1.0'
servers:
  - url: 'http://localhost:3000'
paths:
  /test:
    get:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                node:
                  $ref: '#/components/schemas/Node'
                prop1:
                  $ref: '#/components/schemas/DelegatedTree'
      responses:
        200:
          description: OK

components:
  schemas:
    Node:
      type: object
      properties:
        label:
          type: string
        parent:
          $ref: '#/components/schemas/Tree'
    Tree:
      allOf:
        - $ref: '#/components/schemas/Node'
        - type: object
          properties:
            depth:
              type: integer
    DelegatedTree:
      allOf:
        - $ref: '#/components/schemas/Tree'
        - type: object
          required:
            - label
