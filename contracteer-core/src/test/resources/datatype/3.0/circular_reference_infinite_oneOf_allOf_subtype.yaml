openapi: 3.0.0
info:
  title: Composition-only Circular Ref API
  version: '1.0'
servers:
  - url: 'http://localhost:3000'
paths:
  /pets:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/X'
      responses:
        200:
          description: OK
components:
  schemas:
    Pet:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required:
            - kind
          properties:
            kind:
              type: string
            meow:
              type: string
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required:
            - kind
          properties:
            kind:
              type: string
            bark:
              type: string
    X:
      allOf:
        - $ref: '#/components/schemas/Cat'
        - type: object
          properties:
            whiskers:
              type: integer
