openapi: 3.1.0
info:
  title: Test API
  version: '1.0'
paths:
  /test:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                above:
                  exclusiveMinimum: 5
                below:
                  exclusiveMaximum: 5
                code:
                  pattern: '^[a-z]+$'
                count:
                  format: int32
      responses:
        '200':
          description: OK
