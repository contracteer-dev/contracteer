openapi: 3.1.0
info:
  title: Test API
  version: '1.0'
paths:
  /test:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: strin
                  pattern: '^[a-z]+$'
                status:
                  type: strin
                  const: active
      responses:
        '200':
          description: OK
