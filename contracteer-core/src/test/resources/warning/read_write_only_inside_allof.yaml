openapi: 3.0.0
info:
  title: readOnly And writeOnly Inside allOf
  version: '1.0'
paths:
  /items:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    allOf:
                      - $ref: '#/components/schemas/Id'
                      - readOnly: true
                  secret:
                    allOf:
                      - type: string
                        writeOnly: true
                  outerReadOnly:
                    allOf:
                      - $ref: '#/components/schemas/Id'
                    readOnly: true
                  untypedReadOnly:
                    readOnly: true
                  untypedWriteOnly:
                    writeOnly: true
components:
  schemas:
    Id:
      type: string
