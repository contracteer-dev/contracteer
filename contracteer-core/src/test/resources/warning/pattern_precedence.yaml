openapi: 3.1.0
info:
  title: Pattern Precedence
  version: '1.0'
paths:
  /codes:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    $ref: '#/components/schemas/Code'
                  labels:
                    $ref: '#/components/schemas/Labels'
components:
  schemas:
    Code:
      type: string
      pattern: '^[A-Z]{2}$'
      minLength: 2
    Labels:
      type: object
      propertyNames:
        pattern: '^[a-z]+$'
        maxLength: 20
      additionalProperties:
        type: string
