openapi: 3.0.0
info:
  title: All-Dropped Compositions On Bodies And Parameter Content
  version: '1.0'
paths:
  /body:
    post:
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - {}
      responses:
        '204':
          description: No Content
  /parameter:
    get:
      parameters:
        - name: filter
          in: query
          content:
            application/json:
              schema:
                oneOf:
                  - {}
      responses:
        '204':
          description: No Content
  /supported:
    get:
      responses:
        '204':
          description: No Content
