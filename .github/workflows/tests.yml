name: "Test"

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - '.github/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - '.github/**'
      - 'docs/**'
jobs:
  test:
    name: Test Updated Modules
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: '25'
          enable-graalvm: 'false'

      - name: Build with Gradle
        run: ./gradlew check
